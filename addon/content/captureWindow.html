<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshot Preview</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1f2937;
        height: 100vh;
        display: flex;
        flex-direction: column;
        user-select: none;
      }

      #toolbar {
        background: #111827;
        border-bottom: 1px solid #374151;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #toolbar button {
        padding: 6px 14px;
        border: 1px solid #4b5563;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
        background: #1f2937;
        color: #d1d5db;
      }

      #toolbar button:hover {
        background: #374151;
        color: #f9fafb;
      }

      #close-btn {
        margin-left: auto;
      }

      #counter {
        color: #9ca3af;
        font-size: 13px;
        margin: 0 12px;
      }

      #image-container {
        flex: 1;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
      }

      #captured-image {
        max-width: 100%;
        max-height: 100%;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        border-radius: 4px;
      }

      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: background 0.2s;
      }

      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .nav-btn svg {
        width: 22px;
        height: 22px;
        stroke: white;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #prev-btn {
        left: 16px;
      }

      #next-btn {
        right: 16px;
      }

      #info {
        color: #9ca3af;
        font-size: 12px;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="copy-btn">Copy</button>
      <span id="counter"></span>
      <span id="info"></span>
      <button id="close-btn">Close</button>
    </div>
    <div id="image-container">
      <button id="prev-btn" class="nav-btn" style="display: none">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <img id="captured-image" alt="Screenshot" />
      <button id="next-btn" class="nav-btn" style="display: none">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
      </button>
    </div>

    <script>
      window.addEventListener('load', () => {
        const images = window.arguments?.[0]?.images;
        const startIndex = window.arguments?.[0]?.startIndex || 0;
        const img = document.getElementById('captured-image');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const counter = document.getElementById('counter');
        const info = document.getElementById('info');

        if (!images || images.length === 0) {
          info.textContent = 'No image data';
          return;
        }

        let currentIndex = startIndex;
        const hasMultiple = images.length > 1;

        function showImage(index) {
          currentIndex = index;
          img.src = images[currentIndex];

          if (hasMultiple) {
            counter.textContent = `${currentIndex + 1} / ${images.length}`;
            prevBtn.style.display = currentIndex > 0 ? '' : 'none';
            nextBtn.style.display = currentIndex < images.length - 1 ? '' : 'none';
          }
        }

        showImage(currentIndex);

        img.onload = () => {
          info.textContent = `${img.naturalWidth} × ${img.naturalHeight} px`;
        };

        prevBtn.addEventListener('click', () => {
          if (currentIndex > 0) showImage(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
          if (currentIndex < images.length - 1) showImage(currentIndex + 1);
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            window.close();
            return;
          }
          if (e.key === 'ArrowLeft' && currentIndex > 0) showImage(currentIndex - 1);
          if (e.key === 'ArrowRight' && currentIndex < images.length - 1) showImage(currentIndex + 1);
        });

        document.getElementById('close-btn').addEventListener('click', () => {
          window.close();
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
          if (navigator.clipboard) {
            fetch(images[currentIndex])
              .then((res) => res.blob())
              .then((blob) => {
                const item = new ClipboardItem({ 'image/png': blob });
                navigator.clipboard.write([item]);
              });
          }
        });
      });
    </script>
  </body>
</html>
