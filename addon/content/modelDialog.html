<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="chrome://__addonRef__/content/app.css" rel="stylesheet" />
    <link rel="localization" href="__addonRef__-addon.ftl" />
    <!--  <link href="./app.css" rel="stylesheet"/>-->
    <script>
      // document.addEventListener("DOMContentLoaded", (ev) => {
      //   Services.scriptloader.loadSubScript(
      //     "resource://zotero/require.js",
      //     this,
      //   );
      // });
      window.addEventListener("load", () => {
        window.arguments[0].onBodyLoaded(window);
      });
    </script>
    <!--   <script src="https://cdn.tailwindcss.com"></script>-->
    <!-- <script src="chrome://__addonRef__/content/tailwind.js"></script> -->
    <title data-l10n-id="model-dialog-title">Model Providers</title>
  </head>

  <body class="duration-300 transition-colors text-zinc-900 dark:text-zinc-100">
    <div id="root" class="bg-zinc-100 dark:bg-zinc-800">
      <div class="mx-auto min-h-screen max-w-7xl px-8 py-8">
        <header
          id="provider-head"
          class="mb-10 flex items-center justify-between"
        >
          <h2 class="text-xl font-semibold" data-l10n-id="model-dialog-title">Model Providers</h2>
          <div id="add-provider-container">
            <button
              id="add-provider-button"
              class="relative z-10 flex items-center gap-2 rounded-full bg-rose-500 px-5 py-2.5 text-sm font-semibold text-white shadow-lg transition-all hover:bg-rose-400 active:scale-95"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span data-l10n-id="model-dialog-add-provider">Add Provider</span>
            </button>
          </div>
        </header>
        <div
          id="provider-block"
          class="relative min-h-[200px] grid grid-cols-1 md:grid-cols-2 gap-4"
        ></div>
      </div>
    </div>
    <!-- Centered modal overlay (at root level for correct fixed positioning) -->
    <div
      id="add-provider-overlay"
      class="opacity-0 invisible pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm transition-all duration-200"
    >
      <div
        id="add-provider-popup"
        class="w-[420px] max-h-[520px] flex flex-col rounded-2xl border border-gray-200 bg-white shadow-2xl dark:border-zinc-700 dark:bg-zinc-800 overflow-hidden"
      >
        <div class="p-4 border-b border-gray-100 dark:border-zinc-700">
          <input
            id="provider-search-input"
            type="text"
            placeholder="Search providers..."
            class="w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm outline-none transition-all focus:border-rose-300 focus:ring-2 focus:ring-rose-100 dark:border-zinc-600 dark:bg-zinc-700 dark:text-zinc-100 dark:focus:border-rose-500 dark:focus:ring-rose-900/30"
          />
        </div>
        <div
          id="add-provider-list"
          class="flex flex-col flex-1 min-h-0 overflow-y-auto p-2"
        ></div>
        <div
          id="add-provider-custom"
          class="border-t border-gray-100 p-2 dark:border-zinc-700"
        ></div>
      </div>
    </div>
    <!-- Model selection overlay -->
    <div
      id="model-select-overlay"
      class="opacity-0 invisible pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm transition-all duration-200"
    >
      <div
        class="w-[420px] max-h-[520px] flex flex-col rounded-2xl border border-gray-200 bg-white shadow-2xl dark:border-zinc-700 dark:bg-zinc-800 overflow-hidden"
      >
        <div class="p-4 border-b border-gray-100 dark:border-zinc-700">
          <input
            id="model-search-input"
            type="text"
            placeholder="Search or type model name and press Enter..."
            class="w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm outline-none transition-all focus:border-rose-300 focus:ring-2 focus:ring-rose-100 dark:border-zinc-600 dark:bg-zinc-700 dark:text-zinc-100 dark:focus:border-rose-500 dark:focus:ring-rose-900/30"
          />
        </div>
        <div
          id="model-select-list"
          class="flex flex-col flex-1 min-h-0 overflow-y-auto p-2"
        ></div>
      </div>
    </div>
  </body>
</html>
