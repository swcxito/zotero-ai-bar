name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-plugin.yml@main
    # You can customize any of the inputs here.
    # If you omit an input, its default value will be used.
    with:
      build: "npm run build"
      release: "npm run release"
      comment-template: >-
        ${{ !contains(github.ref_name, '-') && ':rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._' || '' }}
    secrets: inherit
